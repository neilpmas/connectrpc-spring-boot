name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6

      # Publishes to Maven Central (task-connectrpc-spring-boot-starter Phase 8). GitHub
      # Packages (the Phase 5.2 dogfooding stopgap) retired in Phase 8.5 once both known
      # consumers had migrated off it.
      - name: Publish to Maven Central
        run: ./gradlew publish -PpublishVersion=${{ inputs.version }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
