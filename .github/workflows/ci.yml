name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
