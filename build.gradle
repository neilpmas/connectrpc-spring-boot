import io.spring.javaformat.gradle.tasks.CheckFormat
import io.spring.javaformat.gradle.tasks.Format
import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}" apply false
    // javaFormatVersion/checkstyleToolVersion in gradle.properties are verified as a
    // compatible pair from spring-projects/spring-boot's own gradle.properties, not just
    // latest-of-each, since spring-javaformat-checkstyle wraps specific Checkstyle APIs that
    // can break across major Checkstyle versions.
    id 'io.spring.javaformat' version "${javaFormatVersion}" apply false
    // Not Sonatype-official (unlike connectrpc-spring's central-publishing-maven-plugin), but
    // the real de facto Gradle standard for Central Portal publishing -- handles GPG signing
    // and Central upload in one step (task-connectrpc-spring-boot-starter Phase 8).
    id 'com.vanniktech.maven.publish' version "${vanniktechMavenPublishVersion}" apply false
}

allprojects {
    group = 'dev.neilmason'
    // Overridable for real releases (Phase 5.2): ./gradlew publish -PpublishVersion=0.2.0.
    // Defaults to the existing SNAPSHOT so the everyday mavenLocal() dev loop is unaffected.
    version = findProperty('publishVersion') ?: '0.1.0-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'checkstyle'
    apply plugin: 'io.spring.javaformat'

    checkstyle {
        toolVersion = "${checkstyleToolVersion}"
    }

    dependencies {
        checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${javaFormatVersion}"
    }

    // Generated protobuf sources aren't hand-written code -- don't format/lint them, matching
    // spring-projects/spring-boot's own build (JavaConventions.isGeneratedSource(), verified
    // directly against reference-spring-boot/buildSrc: it checks "/generated/sources/", plural,
    // not singular -- copied verbatim here rather than guessed). A plain glob like
    // '**/generated/**' can't match here: the generated directory itself is registered as a whole
    // source root, so "generated" only ever appears in the root, never in the relative path
    // Gradle matches excludes against -- hence checking the absolute path directly.
    def isGeneratedSource = { fileTreeElement ->
        def path = fileTreeElement.file.path.replace(File.separator, '/')
        path.contains('/generated/sources/') || path.contains('/generated-source/')
    }
    tasks.withType(CheckFormat).configureEach {
        exclude isGeneratedSource
    }
    tasks.withType(Format).configureEach {
        exclude isGeneratedSource
    }
    tasks.withType(Checkstyle).configureEach {
        exclude isGeneratedSource
    }

    // Real Maven Central publish (Phase 8). GitHub Packages (the Phase 5.2 dogfooding
    // stopgap) retired in Phase 8.5 once both known consumers had migrated off it --
    // vanniktech's plugin registers its own Central repository under publishing.repositories,
    // so the `publish` task needs no explicit repository config here any more. Metadata shared
    // across every module here; name/description come from each module's own
    // project.name/description.
    pluginManager.withPlugin('maven-publish') {
        apply plugin: 'com.vanniktech.maven.publish'
        mavenPublishing {
            // true = auto-publish once validation passes, matching connectrpc-spring's
            // autoPublish=true -- the default is USER_MANAGED, which just uploads and waits
            // for a manual click in the Central Portal UI.
            publishToMavenCentral(true)
            signAllPublications()
            // Real javadoc (matching connectrpc-spring's maven-javadoc-plugin), not the
            // plugin's default placeholder jar.
            configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
            pom {
                name.set(project.name)
                // Lazy on purpose: subprojects {} here runs before each module's own
                // build.gradle sets its `description`, so an eager project.description read
                // captures null -- Central rejected a real publish over exactly this
                // (deployment 4daa1d57-5bd8-444a-989a-9b8bd2295632, "Project description is
                // missing").
                description.set(project.provider { project.description })
                url.set('https://github.com/neilpmas/connectrpc-spring-boot')
                licenses {
                    license {
                        name.set('Apache License, Version 2.0')
                        url.set('https://www.apache.org/licenses/LICENSE-2.0.txt')
                        distribution.set('https://www.apache.org/licenses/LICENSE-2.0.txt')
                    }
                }
                developers {
                    developer {
                        id.set('neilpmas')
                        name.set('Neil Mason')
                        email.set('neilpmas@gmail.com')
                        url.set('https://github.com/neilpmas')
                    }
                }
                scm {
                    url.set('https://github.com/neilpmas/connectrpc-spring-boot')
                    connection.set('scm:git:https://github.com/neilpmas/connectrpc-spring-boot.git')
                    developerConnection.set('scm:git:ssh://git@github.com/neilpmas/connectrpc-spring-boot.git')
                }
            }
        }
    }
}
