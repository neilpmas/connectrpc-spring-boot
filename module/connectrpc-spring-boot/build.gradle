plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf' version "${protobufGradlePluginVersion}"
}

description = 'Spring Boot autoconfiguration for connectrpc-spring'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

// Matches Spring Boot's own RUNTIME_JAVA_VERSION baseline (JavaConventions.java in the
// spring-boot build) -- the toolchain above is just the JDK this repo builds with, not the
// bytecode target consumers need. Without this, the toolchain's languageVersion silently
// becomes the release target too, producing artifacts unusable below Java 24.
compileJava {
    options.release = 17
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "io.grpc:grpc-bom:${grpcVersion}"
        mavenBom "com.google.protobuf:protobuf-bom:${protobufVersion}"
    }
}

dependencies {
    // A real, resolvable version now that connectrpc-spring-core is genuinely published to
    // Maven Central (task-connectrpc-spring-boot-starter Phase 8) -- no more mavenLocal()
    // workaround, no more cross-repo checkout-and-install in CI, since Central needs no auth
    // to read (unlike the GitHub Packages stopgap this replaces).
    api 'dev.neilmason:connectrpc-spring-core:0.1.2'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.grpc:grpc-services'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'com.google.protobuf:protobuf-java'
    testImplementation 'io.grpc:grpc-protobuf'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        ofSourceSet('test').forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processTestResources', Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
