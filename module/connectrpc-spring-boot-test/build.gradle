plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf' version "${protobufGradlePluginVersion}"
}

description = 'Test support for connectrpc-spring-boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

// Matches Spring Boot's own RUNTIME_JAVA_VERSION baseline (JavaConventions.java in the
// spring-boot build) -- the toolchain above is just the JDK this repo builds with, not the
// bytecode target consumers need. Without this, the toolchain's languageVersion silently
// becomes the release target too, producing artifacts unusable below Java 24.
compileJava {
    options.release = 17
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "io.grpc:grpc-bom:${grpcVersion}"
        mavenBom "com.google.protobuf:protobuf-bom:${protobufVersion}"
    }
}

dependencies {
    api project(':module:connectrpc-spring-boot')
    api 'org.springframework.boot:spring-boot-webtestclient'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'com.google.protobuf:protobuf-java'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.security:spring-security-config'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.springframework.security:spring-security-oauth2-resource-server'
    testImplementation 'io.grpc:grpc-protobuf'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        ofSourceSet('test').forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processTestResources', Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
